<div class="attendance-container">
  <h2 class="title">Attendance</h2>
  <div class="week-navigation bg-secondary">
  <a (click)="previousWeek()"><<</a>
  <span>{{ weekDates[0] }} to {{ weekDates[6] }}</span>
  <a (click)="nextWeek()">>></a>
  </div>
  <form [formGroup]="attendanceForm" (ngSubmit)="onSubmit()">
  <table class="attendance-table">
  <thead class="bg-secondary">
  <tr>
  <th>Date</th>
  <th>Hours Filled</th>
  <th>Remarks</th>
  <th>Project ID</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let day of weeklyAttendance; let i = index">
  <td>
  <input type="text" [value]="day.attendanceDate | date:'yyyy-MM-dd'" class="date-input" readonly />
  </td>
  <td>
  <input type="number" name="hoursFilled" formControlName="hoursFilled{{i}}" min="0" max="24" required />
  </td>
  <td>
  <input type="text" name="remarks" formControlName="remarks{{i}}" maxlength="200" />
  </td>
  <td>
  <input type="text" name="project_id" formControlName="projectId{{i}}" class="readonly-input" readonly />
  </td>
  </tr>
  </tbody>
  </table>
  <div *ngIf="attendanceStatus" class="attendance-status">
  <strong>Attendance Status:</strong> {{ attendanceStatus }}
  </div>
  <button *ngIf="isCurrentWeek" type="submit" class="submit-btn">Submit</button>
  </form>
  </div>
